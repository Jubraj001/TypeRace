<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1530"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#ff2d7e" stroke-width="2"/>
  <!-- speed chevrons -->
  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
    <path d="M16 20 L28 32 L16 44" stroke="#19e7ff"/>
    <path d="M30 20 L42 32 L30 44" stroke="#ff2d7e"/>
  </g>
  <!-- caret -->
  <rect x="46" y="20" width="4" height="24" rx="2" fill="#19e7ff" filter="url(#glow)"/>
</svg>
